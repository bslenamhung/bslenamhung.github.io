  (function(){
    var path = window.location.pathname;
    var match = path.match(/^\/bai-viet\/([^/]+)\.html$/);

      var id = decodeURIComponent(match[1]);
      window.location.replace('/bai-viet.html?id=' + encodeURIComponent(id));

  })();
