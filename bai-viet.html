<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đang chuyển đến bài viết...</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://bslenamhung.github.io/index.html#articles">
</head><body>
<p style="font-family:Arial,sans-serif;text-align:center;margin:20vh 20px">Đang chuyển đến bài viết...</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=73"></script>
<script>
(function(){
  'use strict';
  const id=new URLSearchParams(location.search).get('id');
  const slugify=value=>{
    const raw=String(value||'').trim();
    const slug=raw.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,120);
    return slug;
  };
  const goHome=()=>{location.replace(new URL('index.html#articles',location.href).href)};
  async function run(){
    if(!id){goHome();return}
    try{
      const c=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY||window.SUPABASE_ANON_KEY);
      const r=await c.from('site_content_public').select('content').eq('id',1).maybeSingle();
      const list=Array.isArray(r.data?.content?.articles)?r.data.content.articles:[];
      const a=list.find(x=>x&&x.published!==false&&String(x.id||'')===id);
      if(a){
        const slug=slugify(a.slug||a.title);
        if(slug){location.replace(new URL('bai-viet/'+encodeURIComponent(slug)+'.html',location.href).href);return}
      }
    }catch(e){}
    goHome();
  }
  run();
})();
</script>
</body></html>
