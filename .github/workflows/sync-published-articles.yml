name: Sync published articles and sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-published-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate static article pages and sitemaps
        run: node scripts/generate-articles.mjs
      - name: Commit generated pages if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bai-viet sitemap.xml sitemap.txt
          if git diff --cached --quiet; then
            echo "No generated article or sitemap changes."
            exit 0
          fi
          git commit -m "chore: sync published article pages and sitemaps"
          git push origin HEAD:main
