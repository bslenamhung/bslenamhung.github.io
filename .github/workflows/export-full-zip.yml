name: Export Full Website ZIP

on:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create full website archive
        run: |
          zip -qr "BSLENAMHUNG-GITHUB-FULL-${GITHUB_SHA}.zip" . -x ".git/*"
      - uses: actions/upload-artifact@v4
        with:
          name: BSLENAMHUNG-GITHUB-FULL
          path: BSLENAMHUNG-GITHUB-FULL-${{ github.sha }}.zip
          retention-days: 7
