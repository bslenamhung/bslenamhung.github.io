name: Tu dong cap nhat sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - 'V71-TRIGGER.txt'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tao trang bai viet tinh tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87' }}
        run: python scripts/generate_article_pages.py
      - name: Dam bao tat ca bai viet co trang tinh
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/ensure_all_article_pages.py
      - name: Tao sitemap tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87' }}
        run: python scripts/update_sitemap.py
      - name: Kiem tra sitemap
        shell: bash
        run: |
          set -e
          echo "=== KIEM TRA SITEMAP ==="
          if grep -q 'bai-viet.html?id=' sitemap.xml; then echo "LOI: sitemap con URL bai-viet.html?id="; exit 1; fi
          if grep -q '/bai-viet/legacy-' sitemap.xml; then echo "LOI: sitemap con legacy article"; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re,sys
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>https://bslenamhung\.github\.io/bai-viet/([^<]+\.html)</loc>',sitemap)
          files={p.name for p in Path('bai-viet').glob('*.html')}
          sitemap_files={Path(u).name for u in urls}
          # Legacy article-ID redirect stubs are intentionally kept for old
          # Google/user links, but are not listed in the sitemap.
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          articles=(data.get('articles') or [])
          legacy_ids={
              str(a.get('id')).strip() + '.html'
              for a in articles
              if isinstance(a,dict) and a.get('published') is not False and a.get('id')
          }
          allowed_extra=files & legacy_ids
          print('So bai trong sitemap:',len(sitemap_files))
          print('So file bai-viet:',len(files))
          print('So URL legacy redirect duoc phep:',len(allowed_extra))
          missing=sorted(sitemap_files-files)
          extra=sorted(files-sitemap_files-allowed_extra)
          if missing:
              print('LOI missing:',*missing,sep='\n - '); sys.exit(1)
          if extra:
              print('LOI extra:',*extra,sep='\n - '); sys.exit(1)
          print('Kiem tra file bai viet: OK')
          PY
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('XML sitemap: OK')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Luu V71 va sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bai-viet sitemap.xml data.json data-home.json
          if git diff --cached --quiet; then echo "Khong co thay doi."; else git commit -m "feat: V71 slug bai viet va sitemap"; git push; fi
