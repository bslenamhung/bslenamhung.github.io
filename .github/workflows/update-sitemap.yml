name: Tu dong cap nhat sitemap

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-sitemap.yml'
      - 'V71-TRIGGER.txt'
      - 'bmi.html'
      - 'scripts/generate_article_pages.py'
      - 'scripts/ensure_all_article_pages.py'
      - 'scripts/update_sitemap.py'
      - 'scripts/**'
      - 'supabase-config.js'
  schedule:
    # Đồng bộ bài viết đã xuất bản từ Supabase tự động mỗi 5 phút.
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Tao trang bai viet tinh tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87' }}
        run: python scripts/generate_article_pages.py
      - name: Dam bao tat ca bai viet co trang tinh
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/ensure_all_article_pages.py
      - name: Tao sitemap tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87' }}
        run: python scripts/update_sitemap.py
      - name: Kiem tra sitemap
        shell: bash
        run: |
          set -e
          echo "=== KIEM TRA SITEMAP ==="
          if grep -q 'bai-viet.html?id=' sitemap.xml; then echo "LOI: sitemap con URL bai-viet.html?id="; exit 1; fi
          if grep -q '/bai-viet/legacy-' sitemap.xml; then echo "LOI: sitemap con legacy article"; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re,sys,json
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>https://bslenamhung\.github\.io/bai-viet/([^<]+\.html)</loc>',sitemap)
          files={p.name for p in Path('bai-viet').glob('*.html')}
          sitemap_files={Path(u).name for u in urls}
          # Legacy article-ID redirect stubs are intentionally kept for old
          # Google/user links, but are not listed in the sitemap.
          data=json.loads(Path('data.json').read_text(encoding='utf-8'))
          articles=(data.get('articles') or [])
          legacy_ids={
              str(a.get('id')).strip() + '.html'
              for a in articles
              if isinstance(a,dict) and a.get('published') is not False and a.get('id')
          }
          allowed_extra=files & legacy_ids
          print('So bai trong sitemap:',len(sitemap_files))
          print('So file bai-viet:',len(files))
          print('So URL legacy redirect duoc phep:',len(allowed_extra))
          missing=sorted(sitemap_files-files)
          extra=sorted(files-sitemap_files-allowed_extra)
          if missing:
              print('LOI missing:',*missing,sep='\n - '); sys.exit(1)
          if extra:
              print('LOI extra:',*extra,sep='\n - '); sys.exit(1)
          print('Kiem tra file bai viet: OK')
          PY
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('XML sitemap: OK')
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Kiem tra website sau khi deploy
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, time, re, unicodedata, urllib.parse, urllib.request
          from pathlib import Path
          BASE = 'https://bslenamhung.github.io'
          def slugify(value, fallback='article'):
              value = unicodedata.normalize('NFKD', str(value or '').strip().lower())
              value = ''.join(ch for ch in value if not unicodedata.combining(ch)).replace('đ','d')
              value = re.sub(r'[^a-z0-9]+', '-', value).strip('-')
              return (value[:120] or fallback)
          data = json.loads(Path('data-home.json').read_text(encoding='utf-8'))
          articles = [a for a in (data.get('articles') or []) if isinstance(a, dict) and str(a.get('published', True)).lower() != 'false']
          latest = sorted(articles, key=lambda a: str(a.get('publishedAt') or a.get('createdAt') or a.get('created_at') or a.get('date') or ''), reverse=True)[:5]
          if not latest:
              raise SystemExit('LOI: data-home.json khong co bai viet da xuat ban.')
          failures = []
          for attempt in range(1, 13):
              try:
                  # Verify the public JSON is the same generation as the deployed artifact.
                  check_url = BASE + '/data-home.json?deploy-check=' + str(time.time_ns())
                  req = urllib.request.Request(check_url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'BSHung-Publish-Check/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      live = json.loads(response.read().decode('utf-8'))
                  live_slugs = {slugify(a.get('slug') or a.get('title'), str(a.get('id') or 'article')) for a in (live.get('articles') or [])}
                  expected_slugs = [slugify(a.get('slug') or a.get('title'), str(a.get('id') or 'article')) for a in latest]
                  missing = [s for s in expected_slugs if s not in live_slugs]
                  if missing:
                      raise RuntimeError('JSON public chua co cac bai moi: ' + ', '.join(missing))
                  for slug in expected_slugs:
                      url = BASE + '/bai-viet/' + urllib.parse.quote(slug, safe='-_.') + '.html?deploy-check=' + str(time.time_ns())
                      req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'BSHung-Publish-Check/1.0'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          page = response.read().decode('utf-8', 'replace')
                          if response.status != 200 or 'id="articleLiveRoot"' not in page:
                              raise RuntimeError('Trang bai viet khong hop le: ' + slug)
                  print('OK: data-home.json co bai moi va 5 trang bai viet moi nhat tra ve HTTP 200.')
                  print('5 bai da kiem tra: ' + ', '.join(expected_slugs))
                  break
              except Exception as exc:
                  failures.append(str(exc))
                  if attempt == 12:
                      print('\n'.join(failures[-4:]))
                      raise SystemExit('LOI: website live chua dong bo du sau 12 lan kiem tra.')
                  time.sleep(10)
          PY

      - name: Luu cac trang bai viet va du lieu da dong bo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bai-viet sitemap.xml sitemap.txt data.json data-home.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi can commit."
          else
            git commit -m "chore: sync published articles from Supabase"
            git push
          fi
