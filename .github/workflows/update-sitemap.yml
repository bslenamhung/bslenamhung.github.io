name: Tu dong cap nhat sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - 'V71-TRIGGER.txt'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4
      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Ap dung ho tro Slug V71
        run: python scripts/apply_v71_slug.py
      - name: Tao trang bai viet tinh tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87
        run: python scripts/generate_article_pages.py
      - name: Dat ten URL bai viet theo tieu de
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87
        run: python scripts/pretty_article_urls.py
      - name: Sua bo cuc trang bai viet
        run: python scripts/fix_article_layout.py
      - name: Sua link bai viet sang URL dep
        run: python scripts/fix_article_links.py
      - name: Tao sitemap tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: sb_publishable_gsKYsz40vs6iyWqkb6zyqg_OwoM8k87
        run: python scripts/update_sitemap.py
      - name: Kiem tra sitemap va HTML bai viet
        shell: bash
        run: |
          set -e
          if grep -q 'bai-viet.html?id=' sitemap.xml; then echo "LOI: sitemap con URL bai-viet.html?id="; exit 1; fi
          if grep -q '/bai-viet/legacy-' sitemap.xml; then echo "LOI: sitemap con legacy article"; exit 1; fi
          if grep -R -q 'bai-viet.html?id=' --include='*.html' --exclude='bai-viet.html' --exclude-dir='.git' .; then echo "LOI: HTML bai viet con link bai-viet.html?id="; exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import re,sys
          sitemap=Path('sitemap.xml').read_text(encoding='utf-8')
          urls=re.findall(r'<loc>https://bslenamhung\.github\.io/bai-viet/([^<]+\.html)</loc>',sitemap)
          files={p.name for p in Path('bai-viet').glob('*.html')}
          sitemap_files={Path(u).name for u in urls}
          print('So bai trong sitemap:',len(sitemap_files))
          print('So file bai-viet:',len(files))
          missing=sorted(sitemap_files-files); extra=sorted(files-sitemap_files)
          if missing or extra:
              print('LOI missing:',missing); print('LOI extra:',extra); sys.exit(1)
          for p in Path('bai-viet').glob('*.html'):
              t=p.read_text(encoding='utf-8')
              if t.count('<h1>') > 1:
                  print('LOI: qua nhieu H1 trong',p); sys.exit(1)
              if '../article-layout-fix.css?v=1' not in t:
                  print('LOI: thieu CSS bo cuc trong',p); sys.exit(1)
          print('Kiem tra HTML bai viet: OK')
          PY
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('XML sitemap: OK')
          PY
      - name: Luu V71 va bo cuc bai viet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A admin.html admin.js scripts/generate_article_pages.py scripts/update_sitemap.py scripts/apply_v71_slug.py scripts/fix_article_layout.py scripts/fix_article_links.py scripts/pretty_article_urls.py pretty-article-links.js site-visit.js bai-viet.html article-layout-fix.css bai-viet sitemap.xml V71-CHANGELOG.txt
          if git diff --cached --quiet; then echo "Khong co thay doi."; else git commit -m "fix: dung URL dep cho bai viet"; git push; fi
