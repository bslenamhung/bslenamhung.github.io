name: Kiem tra va dong bo V71

on:
  workflow_dispatch:
  push:
    branches: [ main, v71-clean-final-test ]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-site-content:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Kiem tra khoa Supabase
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_KEY"
          echo "Supabase publishable key: OK"

      - name: Tao trang bai viet tinh tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/generate_article_pages.py

      - name: Tao sitemap tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/update_sitemap.py

      - name: Kiem tra dong bo bai viet va sitemap
        run: python scripts/validate_article_build.py

      - name: Kiem tra phu thuoc V71
        run: |
          set -e
          for f in article-layout-fix.css style.css script.js admin.js article-page.js clinic-page.js site-visit.js supabase-config.js; do test -f "$f"; done
          test ! -e scripts/fix_article_layout.py
          test ! -e scripts/fix_article_links.py
          test ! -e scripts/pretty_article_urls.py
          test ! -e script-core.js
          test ! -e static-article-live-core.js
          echo "V71 dependency check: OK"

      - name: Kiem tra syntax
        run: |
          python -m py_compile scripts/generate_article_pages.py scripts/update_sitemap.py scripts/validate_article_build.py
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse
          root=Path('.')
          for p in root.glob('*.html'):
              s=p.read_text(encoding='utf-8', errors='ignore')
              for u in re.findall(r'(?:src|href)=["\']([^"\']+)', s, re.I):
                  if u.startswith(('http://','https://','mailto:','tel:','#','data:','javascript:','/')): continue
                  assert (p.parent/urllib.parse.urlparse(u).path).exists(), (p,u)
          print('HTML local references: OK')
          PY

      - name: Luu bai viet va sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A bai-viet sitemap.xml
          if git diff --cached --quiet; then
            echo 'Khong co thay doi.'
          else
            git commit -m 'chore: cap nhat bai viet va sitemap'
            git push
          fi
