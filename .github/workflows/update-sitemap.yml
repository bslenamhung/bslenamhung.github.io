name: Tu dong cap nhat bai viet va sitemap

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-site-content:
    runs-on: ubuntu-latest
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Tao trang bai viet tinh tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/generate_article_pages.py

      - name: Tao sitemap tu Supabase
        env:
          SUPABASE_URL: https://tufzlxfrtdhestbemcly.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/update_sitemap.py

      - name: Kiem tra dong bo bai viet va sitemap
        run: python scripts/validate_article_build.py

      - name: Kiem tra phu thuoc V71
        run: |
          set -e
          test -f article-layout-fix.css
          test -f style.css
          test -f script.js
          test -f admin.js
          test -f article-page.js
          test -f clinic-page.js
          test -f site-visit.js
          test -f supabase-config.js
          test ! -e scripts/fix_article_layout.py
          test ! -e scripts/fix_article_links.py
          test ! -e scripts/pretty_article_urls.py
          test ! -e script-core.js
          test ! -e static-article-live-core.js
          echo "V71 dependency check: OK"

      - name: Luu bai viet va sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A bai-viet sitemap.xml
          if git diff --cached --quiet; then
            echo 'Khong co thay doi.'
          else
            git commit -m 'chore: cap nhat bai viet va sitemap'
            git push
          fi
